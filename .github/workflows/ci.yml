name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs strictly from the lockfile — reproducible builds.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Fixtures are up to date with their generator
        run: |
          npm run build:fixture
          git diff --exit-code fixtures/

      - name: Dataset validates
        run: npm run validate:dataset

      - name: Synonyms all resolve
        run: npm run check:synonyms

      - name: Tests
        run: npm test

      # Catches anything that bundles under Node but not on the Workers
      # runtime, and reports the deployed size.
      - name: Worker bundles
        run: npm run deploy:dry

      - name: No SQL.FM data committed
        run: |
          if git ls-files --error-unmatch data/dataset.v1.json 2>/dev/null; then
            echo "::error::data/dataset.v1.json is committed. Real SQL.FM data must not be in this repository until permission is explicit (docs/architecture.md section 4)."
            exit 1
          fi
          echo "ok: no dataset file committed"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
